[project]
name = "total-time-playlist-youtube-telegram-bot"
version = "2026.7.10"
description = "Telegram bot for calculating the total playtime of YouTube playlists"
requires-python = ">=3.10, <3.11"
dependencies = [
    "dpath==2.0.5",
    "python-telegram-bot==13.11",
    "requests==2.26.0",
    "setuptools<70",
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/"]
